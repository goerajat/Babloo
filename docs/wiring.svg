<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="980" height="700" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Babloo wiring: every connection, no soldering</text>

  <!-- Legend -->
  <g transform="translate(20,45)">
    <rect x="0" y="0" width="300" height="78" rx="6" fill="#fafafa" stroke="#ccc"/>
    <line x1="12" y1="18" x2="52" y2="18" stroke="#d33" stroke-width="4"/>
    <text x="60" y="22" fill="#222">Power (5 V, 7.2–9 V)</text>
    <line x1="12" y1="38" x2="52" y2="38" stroke="#2266cc" stroke-width="3"/>
    <text x="60" y="42" fill="#222">Data cable (USB, ribbon, LEGO RJ12)</text>
    <line x1="12" y1="58" x2="52" y2="58" stroke="#2a9d4a" stroke-width="3" stroke-dasharray="7,5"/>
    <text x="60" y="62" fill="#222">Wireless (Wi-Fi / Tailscale)</text>
  </g>

  <!-- Camera assembly -->
  <g transform="translate(400,50)">
    <rect x="0" y="0" width="260" height="110" rx="8" fill="#fff4e0" stroke="#d98a1f" stroke-width="2"/>
    <text x="130" y="22" text-anchor="middle" font-weight="bold" fill="#222">Arducam Day-Night camera</text>
    <text x="130" y="40" text-anchor="middle" fill="#444">OV5647 · motorised IR-cut · M12 lens</text>
    <!-- IR boards -->
    <rect x="12" y="55" width="80" height="44" rx="4" fill="#fde9c9" stroke="#d98a1f"/>
    <text x="52" y="73" text-anchor="middle" font-size="11" fill="#222">IR LED board</text>
    <text x="52" y="88" text-anchor="middle" font-size="11" fill="#222">+ light sensor</text>
    <rect x="168" y="55" width="80" height="44" rx="4" fill="#fde9c9" stroke="#d98a1f"/>
    <text x="208" y="73" text-anchor="middle" font-size="11" fill="#222">IR LED board</text>
    <text x="208" y="88" text-anchor="middle" font-size="11" fill="#222">+ light sensor</text>
    <text x="130" y="80" text-anchor="middle" font-size="11" fill="#7a4a00">2 screws each side</text>
    <text x="130" y="95" text-anchor="middle" font-size="11" fill="#7a4a00">screws carry power</text>
  </g>
  <!-- Ribbon camera -> Pi -->
  <line x1="530" y1="160" x2="530" y2="235" stroke="#2266cc" stroke-width="3"/>
  <text x="540" y="200" fill="#2266cc">15-pin ribbon cable → CSI port</text>
  <text x="540" y="216" fill="#2266cc" font-size="11">contacts face the micro-HDMI side, blue tab faces USB/Ethernet</text>

  <!-- Raspberry Pi -->
  <g transform="translate(380,235)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="#e8f1ff" stroke="#2266cc" stroke-width="2"/>
    <text x="150" y="24" text-anchor="middle" font-weight="bold" fill="#222">Raspberry Pi 4 Model B (1 GB)</text>
    <text x="150" y="42" text-anchor="middle" fill="#444">Pi OS Lite · MediaMTX · control server · Tailscale</text>
    <!-- ports -->
    <rect x="-10" y="60" width="20" height="22" rx="3" fill="#fff" stroke="#d33"/>
    <text x="16" y="76" font-size="11" fill="#222">USB-C power in</text>
    <rect x="140" y="-10" width="22" height="18" rx="3" fill="#fff" stroke="#2266cc"/>
    <text x="150" y="-14" text-anchor="middle" font-size="11" fill="#222">CSI</text>
    <rect x="290" y="60" width="20" height="22" rx="3" fill="#fff" stroke="#2266cc"/>
    <text x="284" y="76" text-anchor="end" font-size="11" fill="#222">USB-A ×4</text>
    <rect x="290" y="100" width="20" height="22" rx="3" fill="#fff" stroke="#2266cc"/>
    <text x="284" y="116" text-anchor="end" font-size="11" fill="#222">USB-A (spare)</text>
    <text x="150" y="110" text-anchor="middle" font-size="11" fill="#555">Heatsinks on SoC, RAM, USB chip</text>
    <text x="150" y="128" text-anchor="middle" font-size="11" fill="#555">GPIO header: nothing connected</text>
    <circle cx="40" cy="128" r="6" fill="none" stroke="#2a9d4a" stroke-width="2"/>
    <text x="52" y="132" font-size="11" fill="#2a9d4a">Wi-Fi</text>
  </g>

  <!-- Power bank -->
  <g transform="translate(60,250)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#ffe8e8" stroke="#d33" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#222">USB power bank</text>
    <text x="100" y="42" text-anchor="middle" fill="#444">Amazon Basics 20 Ah</text>
    <text x="100" y="58" text-anchor="middle" fill="#444">or INIU 10 Ah</text>
    <rect x="190" y="45" width="20" height="22" rx="3" fill="#fff" stroke="#d33"/>
    <text x="184" y="60" text-anchor="end" font-size="11" fill="#222">USB-C out</text>
    <text x="100" y="90" text-anchor="middle" font-size="11" fill="#7a0000">use a USB-C port: 5 V / 3 A</text>
    <text x="100" y="106" text-anchor="middle" font-size="11" fill="#7a0000">USB-A port is 2.4 A only</text>
  </g>
  <line x1="270" y1="306" x2="370" y2="306" stroke="#d33" stroke-width="4"/>
  <text x="320" y="296" text-anchor="middle" font-size="11" fill="#d33">USB-C to USB-C, 1 ft</text>

  <!-- Phone and router -->
  <g transform="translate(60,420)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#eafbea" stroke="#2a9d4a" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#222">Home Wi-Fi router</text>
    <text x="100" y="44" text-anchor="middle" fill="#444">internet uplink</text>
  </g>
  <g transform="translate(60,520)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#eafbea" stroke="#2a9d4a" stroke-width="2"/>
    <text x="100" y="24" text-anchor="middle" font-weight="bold" fill="#222">Your phone</text>
    <text x="100" y="44" text-anchor="middle" fill="#444">browser + Tailscale app</text>
  </g>
  <path d="M 420 363 C 330 400, 300 430, 262 445" fill="none" stroke="#2a9d4a" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="330" y="420" font-size="11" fill="#2a9d4a">2.4 / 5 GHz Wi-Fi</text>
  <path d="M 160 480 L 160 520" fill="none" stroke="#2a9d4a" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="170" y="505" font-size="11" fill="#2a9d4a">Tailscale VPN (anywhere)</text>

  <!-- Pi -> EV3 USB -->
  <path d="M 690 306 L 760 306 L 760 470 L 620 470" fill="none" stroke="#2266cc" stroke-width="3" marker-end="url(#arr)"/>
  <text x="770" y="390" font-size="11" fill="#2266cc">USB-A → mini-USB-B, 1 ft</text>
  <text x="770" y="406" font-size="11" fill="#2266cc">Ethernet-over-USB, Pi is host</text>
  <text x="770" y="422" font-size="11" fill="#2266cc">Pi 10.42.0.1 ↔ EV3 10.42.0.x</text>

  <!-- optional speakerphone -->
  <g transform="translate(760,470)">
    <rect x="0" y="0" width="190" height="50" rx="8" fill="#f3f3f3" stroke="#999" stroke-dasharray="4,3"/>
    <text x="95" y="21" text-anchor="middle" fill="#444">Optional: USB speakerphone</text>
    <text x="95" y="39" text-anchor="middle" font-size="11" fill="#666">plugs into spare USB-A</text>
  </g>
  <path d="M 690 346 L 740 346 L 740 495 L 760 495" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- EV3 brick -->
  <g transform="translate(380,450)">
    <rect x="0" y="0" width="240" height="150" rx="8" fill="#f0f0f0" stroke="#555" stroke-width="2"/>
    <text x="120" y="24" text-anchor="middle" font-weight="bold" fill="#222">LEGO EV3 brick</text>
    <text x="120" y="42" text-anchor="middle" fill="#444">ev3dev on microSD · motor_server.py</text>
    <!-- mini USB PC port -->
    <rect x="230" y="10" width="20" height="20" rx="3" fill="#fff" stroke="#2266cc"/>
    <text x="224" y="24" text-anchor="end" font-size="11" fill="#222">PC port (mini-USB)</text>
    <!-- motor ports top -->
    <text x="120" y="66" text-anchor="middle" font-size="11" fill="#555">Output ports (top edge)</text>
    <g font-size="12" fill="#222">
      <rect x="20" y="74" width="40" height="22" rx="3" fill="#fff" stroke="#2266cc" stroke-width="2"/><text x="40" y="90" text-anchor="middle">A</text>
      <rect x="70" y="74" width="40" height="22" rx="3" fill="#fff" stroke="#2266cc" stroke-width="2"/><text x="90" y="90" text-anchor="middle">B</text>
      <rect x="130" y="74" width="40" height="22" rx="3" fill="#fff" stroke="#555"/><text x="150" y="90" text-anchor="middle">C</text>
      <rect x="180" y="74" width="40" height="22" rx="3" fill="#fff" stroke="#2266cc" stroke-width="2"/><text x="200" y="90" text-anchor="middle">D</text>
    </g>
    <text x="120" y="118" text-anchor="middle" font-size="11" fill="#555">Input ports 1–4 (bottom edge): optional touch / ultrasonic</text>
    <!-- battery -->
    <rect x="20" y="126" width="200" height="18" rx="3" fill="#ffe8e8" stroke="#d33"/>
    <text x="120" y="139" text-anchor="middle" font-size="11" fill="#7a0000">6× AA NiMH or LEGO 45501 pack (inside brick)</text>
  </g>

  <!-- Motors -->
  <g transform="translate(300,630)">
    <rect x="0" y="0" width="150" height="50" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
    <text x="75" y="21" text-anchor="middle" font-weight="bold" fill="#222">Large motor L</text>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#444">left wheel</text>
  </g>
  <g transform="translate(550,630)">
    <rect x="0" y="0" width="150" height="50" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
    <text x="75" y="21" text-anchor="middle" font-weight="bold" fill="#222">Large motor R</text>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#444">right wheel</text>
  </g>
  <g transform="translate(110,630)">
    <rect x="0" y="0" width="150" height="50" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
    <text x="75" y="21" text-anchor="middle" font-weight="bold" fill="#222">Tilt motor</text>
    <text x="75" y="40" text-anchor="middle" font-size="11" fill="#444">camera up / down</text>
  </g>
  <path d="M 420 546 L 420 585 L 185 585 L 185 630" fill="none" stroke="#2266cc" stroke-width="3"/>
  <path d="M 470 546 L 470 600 L 375 600 L 375 630" fill="none" stroke="#2266cc" stroke-width="3"/>
  <path d="M 580 546 L 580 600 L 625 600 L 625 630" fill="none" stroke="#2266cc" stroke-width="3"/>
  <text x="490" y="615" text-anchor="middle" font-size="11" fill="#2266cc">LEGO RJ12 motor cables: A → tilt, B → left, D → right</text>
</svg>
